<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreelanceLock</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">⬟ FreelanceLock</div>

  <div class="search-box">
    <input type="text" placeholder="Buscar...">
  </div>
</header>

<!-- HOME -->

<section id="home" class="page active">

  <div class="card titulo">
    Valor dos Serviços  (A hora)
  </div>

  <div class="card linguagem" onclick="abrirCalculadora('HTML',30)">
    HTML: R$30
  </div>

  <div class="card linguagem" onclick="abrirCalculadora('CSS',40)">
    CSS: R$40
  </div>

  <div class="card linguagem" onclick="abrirCalculadora('JavaScript',50)">
    JavaScript: R$50
  </div>

</section>

<!-- CALCULADORA -->

<section id="calculadora" class="page">

  <button class="voltar" onclick="trocarPagina('home')">
    ← Voltar
  </button>

  <div class="card titulo" id="tituloCalc">
    Calculadora
  </div>

  <form id="form">

    <label>Empresa</label>
    <input type="text" id="empresa" required>

    <label>Serviço</label>
    <input type="text" id="servico" required>

    <label>Horas Trabalhadas</label>
    <input type="number" id="horas" required>

    <label>Valor por Hora</label>
    <input type="number" id="valorHora" required>

    <label>Imposto (%)</label>
    <input type="number" id="imposto" required>

    <label>Desconto (%)</label>
    <input type="number" id="desconto" required>

    <label>Urgência</label>

    <select id="urgencia">
      <option value="0">Sem urgência</option>
      <option value="20">Com urgência (+20%)</option>
      <option value="50">Muita urgência (+50%)</option>
    </select>

    <button type="submit" class="calcBtn">
      Calcular
    </button>

  </form>

  <div id="resultado"></div>

</section>

<!-- PROJETOS -->

<section id="projetos" class="page">

  <button class="voltar" onclick="trocarPagina('home')">
    ← Voltar
  </button>

  <div class="card titulo">
    Projetos para Iniciar
  </div>

  <ul id="listaProjetos"></ul>

</section>

<!-- EM ANDAMENTO -->

<section id="andamento" class="page">

  <button class="voltar" onclick="trocarPagina('home')">
    ← Voltar
  </button>

  <div class="card titulo">
    Em Andamento
  </div>

  <ul id="listaAndamento"></ul>

</section>

<!-- FINALIZADOS -->

<section id="finalizados" class="page">

  <button class="voltar" onclick="trocarPagina('home')">
    ← Voltar
  </button>

  <div class="card titulo">
    Finalizados
  </div>

  <ul id="listaFinalizados"></ul>

</section>

<!-- FOOTER -->

<footer>

  <button onclick="trocarPagina('projetos')">
    Projetos para Iniciar
  </button>

  <button onclick="trocarPagina('andamento')">
    Em Andamento
  </button>

  <button onclick="trocarPagina('finalizados')">
    Finalizados
  </button>

</footer>

<script src="script.js"></script>

</body>
</html>
